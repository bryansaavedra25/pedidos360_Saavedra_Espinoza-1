server.port=8081
spring.config.import=optional:classpath:aws-credentials.properties

# Región e Infraestructura AWS
spring.cloud.aws.region.static=us-east-1
aws.region.static=us-east-1

# Seguridad Cognito OAuth2 (mismo User Pool que backend-pedidos)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_EA0XQzQRL
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_EA0XQzQRL/.well-known/jwks.json

# ==========================================
# CONFIGURACIÓN AMAZON KINESIS DATA STREAMS
# ==========================================
aws.kinesis.streams.pedidos=pedidos-stream
aws.kinesis.streams.inventario=inventario-stream
aws.kinesis.streams.dlq=mensajes-fallidos-stream

aws.kinesis.default-shards=3
aws.kinesis.default-retention-hours=24

